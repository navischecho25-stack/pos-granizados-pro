<script>
    const API_BASE = window.location.protocol.startsWith("http")
      ? window.location.origin
      : "http://127.0.0.1:8000";
    const BUSINESS_ID = "biz-granizados-001";
    const OFFLINE_QUEUE_KEY = "pos_granizados_offline_queue_v1";
    let products = [];
    let cart = [];
    let activeShiftId = localStorage.getItem("active_shift_id") || null;

    function getPosPin() {
      let pin = sessionStorage.getItem("pos_access_pin");
      if (!pin) {
        pin = prompt("Ingresa el PIN de acceso a caja:", "1234") || "";
        if (pin) sessionStorage.setItem("pos_access_pin", pin.trim());
      }
      return pin.trim();
    }

    function authHeaders(extra = {}) {
      return {
        "X-POS-PIN": getPosPin(),
        ...extra
      };
    }

    async function apiFetch(path, options = {}) {
      const headers = authHeaders(options.headers || {});
      const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
      if (res.status === 401) {
        sessionStorage.removeItem("pos_access_pin");
        throw new Error("PIN incorrecto. Recarga o vuelve a intentarlo.");
      }
      return res;
    }
